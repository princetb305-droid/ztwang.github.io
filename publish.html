<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="通过 GitHub 账号发布博客文章。">
    <title>发布文章 - My Blog</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="回到首页">
        <span class="brand-mark">B</span>
        <span>My Blog</span>
      </a>
      <nav class="nav-links" aria-label="主导航">
        <a href="index.html#posts">文章</a>
        <a href="index.html#about">关于</a>
        <a aria-current="page" href="publish.html">发布</a>
      </nav>
    </header>

    <main class="publish-shell">
      <section class="publish-heading" aria-labelledby="publish-title">
        <p class="section-kicker">Publish</p>
        <h1 id="publish-title">在网页里发布新博客</h1>
        <p>
          填入你的 GitHub 仓库信息和 token 后，页面会先确认 token 的 GitHub 用户名等于仓库 owner，
          再把文章和索引一次提交到仓库。
        </p>
      </section>

      <form class="publish-form" id="publishForm">
        <fieldset>
          <legend>GitHub 仓库</legend>
          <div class="form-grid">
            <label>
              <span>Owner</span>
              <input id="repoOwner" name="repoOwner" autocomplete="username" placeholder="你的 GitHub 用户名" required>
            </label>
            <label>
              <span>Repository</span>
              <input id="repoName" name="repoName" placeholder="username.github.io 或 blog" required>
            </label>
            <label>
              <span>Branch</span>
              <input id="repoBranch" name="repoBranch" value="main" required>
            </label>
            <label>
              <span>发布目录</span>
              <input id="sitePath" name="sitePath" value="" placeholder="根目录留空；docs 填 docs">
            </label>
          </div>
          <label>
            <span>GitHub fine-grained token</span>
            <input id="githubToken" name="githubToken" type="password" autocomplete="off" placeholder="需要 Contents: Read and write 权限" required>
          </label>
        </fieldset>

        <fieldset>
          <legend>文章内容</legend>
          <label>
            <span>标题</span>
            <input id="title" name="title" placeholder="文章标题" required>
          </label>
          <div class="form-grid">
            <label>
              <span>日期</span>
              <input id="date" name="date" type="date" required>
            </label>
            <label>
              <span>标签</span>
              <input id="tags" name="tags" placeholder="AI, Notes, Life">
            </label>
          </div>
          <label>
            <span>摘要</span>
            <textarea id="summary" name="summary" rows="3" placeholder="用于首页卡片的一句话摘要" required></textarea>
          </label>
          <label>
            <span>Markdown 正文</span>
            <textarea id="content" name="content" rows="16" placeholder="# 小标题&#10;&#10;这里写正文..." required></textarea>
          </label>
        </fieldset>

        <div class="publish-actions">
          <button class="button secondary" id="previewButton" type="button">预览</button>
          <button class="button primary" id="submitButton" type="submit">发布到 GitHub</button>
        </div>
        <p class="status" id="publishStatus" role="status"></p>
      </form>

      <section class="preview-panel" aria-labelledby="preview-title">
        <div class="section-heading compact">
          <div>
            <p class="section-kicker">Preview</p>
            <h2 id="preview-title">文章预览</h2>
          </div>
        </div>
        <article class="article preview" id="preview">
          <p class="empty-state">点击“预览”查看渲染效果。</p>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <span>Token 只保存在当前页面内存中</span>
      <span>GitHub 会执行最终权限校验</span>
    </footer>

    <script src="assets/publish.js" type="module"></script>
  </body>
</html>
